[package]
name = "orphos-python"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Python bindings for Orphos gene finder"
license = "GPL-3.0-or-later"
repository = "https://github.com/FullHuman/orphos"

[lib]
name = "orphos_python"
crate-type = ["cdylib"]

[dependencies]
orphos-core = { path = "../orphos-core" }
pyo3 = { version = "0.29.0", features = ["extension-module"] }
bio = "4.0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
