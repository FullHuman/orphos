[package]
name = "orphos-wasm"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "WebAssembly bindings for Orphos gene finder"
license = "GPL-3.0-or-later"
repository = "https://github.com/fullhuman/orphos"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
orphos-core = { path = "../orphos-core" }
wasm-bindgen = "0.2.126"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
bio = "4.0.1"
# This must match bio's rand 0.8 dependency so its `js` feature is unified.
getrandom = { version = "0.2.17", features = ["js"] }
