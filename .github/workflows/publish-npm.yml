name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry run (no actual publishing)'
        required: false
        default: false
        type: boolean

jobs:
  publish-npm:
    name: Publish WASM Package to npm
    runs-on: ubuntu-latest
    # npm takes the identity of this workflow run as the credentials to
    # publish (trusted publishing): the package on npmjs.com names this
    # repository and this workflow file as its trusted publisher, and no
    # token is stored here.
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

    - name: Build WASM package
      working-directory: orphos-wasm
      run: npm run build:node

    - name: Verify package
      working-directory: orphos-wasm/pkg-node
      run: npm pack --dry-run

    - name: Show npm version
      run: npm --version

    - name: Publish to npm (dry run)
      if: inputs.dry_run
      working-directory: orphos-wasm/pkg-node
      run: npm publish --dry-run

    - name: Publish to npm
      if: '!inputs.dry_run'
      working-directory: orphos-wasm/pkg-node
      run: npm publish --access public

    - name: Create summary
      run: |
        echo "### Published Package" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ @fullhuman/orphos (npm)" >> $GITHUB_STEP_SUMMARY
        if [ "${{ inputs.dry_run }}" = "true" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** This was a dry run. No package was actually published." >> $GITHUB_STEP_SUMMARY
        fi
