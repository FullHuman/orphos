name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry run (no actual publishing)'
        required: false
        default: false
        type: boolean

jobs:
  publish-npm:
    name: Publish WASM Package to npm
    runs-on: ubuntu-latest
    # npm takes the identity of this workflow run as the credentials
    # (trusted publishing): the package on npmjs.com names this repository
    # and this workflow file as its trusted publisher, and no token is
    # stored here.
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        # Trusted publishing and `npm stage` need a recent npm 11, which Node 24
        # ships.
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

    - name: Build WASM package
      working-directory: orphos-wasm
      run: npm run build:node

    - name: Verify package
      working-directory: orphos-wasm/pkg-node
      run: npm pack --dry-run

    - name: Show npm version
      run: npm --version

    - name: Stage the package on npm (dry run)
      if: inputs.dry_run
      working-directory: orphos-wasm/pkg-node
      run: npm stage publish . --dry-run

    # The trusted publisher may stage a version, not publish it: the version
    # becomes public when a maintainer approves it on npmjs.com.
    - name: Stage the package on npm
      if: '!inputs.dry_run'
      working-directory: orphos-wasm/pkg-node
      run: npm stage publish . --access public

    - name: Create summary
      run: |
        echo "### Staged Package" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ @fullhuman/orphos (npm)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ inputs.dry_run }}" = "true" ]; then
          echo "**Note:** This was a dry run. No package was staged." >> $GITHUB_STEP_SUMMARY
        else
          echo "**Next step:** a maintainer approves the staged version on npmjs.com (or with \`npm stage approve\`) to make it public." >> $GITHUB_STEP_SUMMARY
        fi
